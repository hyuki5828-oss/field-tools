<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="電子黒板">
<meta name="theme-color" content="#111827">
<title>電子黒板カメラ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#111827;--panel:#1f2937;--fg:#f3f4f6;--pri:#2563eb;--ok:#16a34a;--ng:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea,button{font-size:16px}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:var(--bg);flex-shrink:0}
.top #siteBtn{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;border:0;border-radius:8px;padding:9px 12px;background:var(--panel);color:var(--fg)}
button.pri{background:var(--pri)}button.ok{background:var(--ok)}button.ng{background:var(--ng)}
button.on{background:#f59e0b;color:#111}
button:disabled{opacity:.4}
.memo{display:flex;gap:6px;padding:0 10px 6px;background:var(--bg);flex-shrink:0;align-items:stretch}
.memo textarea{flex:1;font:inherit;font-size:16px;border-radius:8px;border:1px solid #374151;background:#0b1220;color:var(--fg);padding:6px 8px;resize:none;height:56px}
.memo .col{display:flex;flex-direction:column;gap:4px}
.memo .col button{padding:5px 8px;font-size:13px}
#stage{flex:1;position:relative;min-height:0;background:#000}
#cv{width:100%;height:100%;display:block;touch-action:none}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.bar{display:flex;justify-content:space-around;align-items:center;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg);flex-shrink:0}
.shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid #9ca3af;padding:0}
.ptt{width:78px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pttcol{display:flex;flex-direction:column;gap:6px}
#delLineBtn{width:78px;padding:6px 4px;font-size:13px}
.ptt.rec{background:var(--ng);color:#fff}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10;align-items:flex-end}
#modal.on{display:flex}
#sheet{background:#fff;color:#111827;width:100%;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
#sheet h3{margin:0 0 10px}
#sheet button{background:#e5e7eb;color:#111827}
#sheet button.pri{background:var(--pri);color:#fff}#sheet button.ng{background:var(--ng);color:#fff}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.row label{width:96px;font-size:14px}
.row input[type=range],.row select{flex:1;font:inherit;padding:6px}
.site{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #e5e7eb}
.site b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site.cur b::before{content:"● ";color:var(--ok)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:20;max-width:90%;text-align:center}
.top{grid-area:top}.memo{grid-area:memo}#stage{grid-area:stage}#liveBar,#stillBar{grid-area:bar}
/* 横向き: 左に画面いっぱいのプレビュー、右に操作パネルを縦に並べる */
@media (orientation:landscape) and (max-height:560px){
  #app{display:grid;grid-template-columns:1fr 230px;grid-template-rows:auto auto 1fr;
    grid-template-areas:"stage top" "stage memo" "stage bar";
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .top{padding-top:6px}
  .memo textarea{height:44px}
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);align-content:start;overflow-y:auto;min-height:0}
  .shutter{grid-column:1/-1;justify-self:center;order:-1;width:64px;height:64px}
  .ptt,#delLineBtn{width:100%}
  #stillBar button{padding:16px 6px}
  #toast{bottom:20px}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button id="siteBtn">現場</button>
    <button id="torchBtn" class="hide">🔦</button>
    <button id="setBtn">⚙</button>
  </div>
  <div class="memo">
    <textarea id="memo" placeholder="撮影内容（キーボードのマイクで音声入力）"></textarea>
    <div class="col">
      <button id="micBtn">🎤 音声</button>
      <button id="modeBtn">置換</button>
    </div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><video id="vid" playsinline muted></video></div>
  <div class="bar" id="liveBar">
    <input id="fileIn" type="file" accept="image/*" capture="environment" hidden>
    <button id="nativeBtn">標準カメラ<br><small>高画質</small></button>
    <button id="shutter" class="shutter" aria-label="撮影"></button>
    <div class="pttcol">
      <button id="delLineBtn">1行削除</button>
      <button id="pttBtn" class="ptt">🎤<br><small>押して話す</small></button>
    </div>
  </div>
  <div class="bar hide" id="stillBar">
    <button id="retake">再撮影</button>
    <button id="saveBtn" class="ok">保存（2枚）</button>
  </div>
</div>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
